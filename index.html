<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>뉴토끼남 - 나만의 내러티브 E-Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Song+Myung&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/vconsole@3.15.1/dist/vconsole.min.js"></script>
    <script>
        if (typeof VConsole !== 'undefined') {
            window.vConsole = new VConsole({
                theme: 'dark',
                maxLogNumber: 10000
            });
        }

        (function() {
            var STORAGE_KEY = '_safari_crash_blackbox';
            
            function saveToBlackbox(type, message) {
                try {
                    var time = new Date().toLocaleTimeString();
                    var currentLogs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                    currentLogs.push('[' + time + '] [' + type + '] ' + message);
                    if (currentLogs.length > 150) currentLogs.shift();
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentLogs));
                } catch(e) {}
            }

            var originalLog = console.log;
            var originalWarn = console.warn;
            var originalError = console.error;

            console.log = function() {
                var args = Array.prototype.slice.call(arguments);
                var msg = args.map(function(a) { return typeof a === 'object' ? JSON.stringify(a) : a; }).join(' ');
                saveToBlackbox('LOG', msg);
                originalLog.apply(console, arguments);
            };
            console.warn = function() {
                var args = Array.prototype.slice.call(arguments);
                var msg = args.map(function(a) { return typeof a === 'object' ? JSON.stringify(a) : a; }).join(' ');
                saveToBlackbox('WARN', msg);
                originalWarn.apply(console, arguments);
            };
            console.error = function() {
                var args = Array.prototype.slice.call(arguments);
                var msg = args.map(function(a) { return typeof a === 'object' ? JSON.stringify(a) : a; }).join(' ');
                saveToBlackbox('ERR', msg);
                originalError.apply(console, arguments);
            };

            var heartbeatCount = 0;
            setInterval(function() {
                heartbeatCount++;
                var audioInfo = '정지 상태';
                if (typeof currentPlayingMusicId !== 'undefined' && currentPlayingMusicId) {
                    audioInfo = '재생중 ID: ' + currentPlayingMusicId + ' (' + (typeof currentPlayingType !== 'undefined' ? currentPlayingType : 'unknown') + ')';
                }
                saveToBlackbox('HEARTBEAT', '사파리 엔진 생존 중.. [' + heartbeatCount + '] | 음악: ' + audioInfo);
            }, 250);

            window.onerror = function(msg, url, line, col, error) {
                var stack = error && error.stack ? error.stack : 'No stack';
                saveToBlackbox('CRASH_ERR', msg + ' (' + url + ':' + line + ':' + col + ') \nStack: ' + stack);
                return false;
            };

            window.addEventListener('unhandledrejection', function(e) {
                var reason = e.reason;
                var msg = reason && reason.message ? reason.message : JSON.stringify(reason);
                saveToBlackbox('PROMISE_ERR', msg);
            });

            window.addEventListener('DOMContentLoaded', function() {
                setTimeout(function() {
                    var saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        var logs = JSON.parse(saved);
                        if (logs.length > 0) {
                            originalError.call(console, "==== 🚨 사파리 새로고침 직전 마지막 블랙박스 기록 ====");
                            logs.forEach(function(logLine) {
                                originalWarn.call(console, logLine); 
                            });
                            originalError.call(console, "====================================================");
                            if (window.vConsole && typeof window.vConsole.show === 'function') {
                                window.vConsole.show();
                            }
                        }
                        localStorage.removeItem(STORAGE_KEY);
                    }
                }, 800);
            });
        })();
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen transition-colors duration-300">

<div class="topbar fixed top-0 left-0 right-0 z-50">
    <div class="flex items-center space-x-2">
        <button id="btnToc" onclick="toggleToc()" class="tb-btn"><i class="fa-solid fa-bars"></i></button>
        <span id="tbTitle" class="text-sm font-semibold truncate max-w-[180px] sm:max-w-xs">뉴토끼남 뷰어</span>
    </div>
    <div class="flex items-center space-x-1">
        <button onclick="toggleTheme()" class="tb-btn"><i class="fa-solid fa-moon"></i></button>
        <button onclick="openFontModal()" class="tb-btn"><i class="fa-solid fa-font"></i></button>
        <button onclick="openShareModal()" class="tb-btn text-indigo-600"><i class="fa-solid fa-cloud-arrow-up"></i></button>
    </div>
    <div id="page-top-scroll-progress"></div>
</div>

<div id="reader-top-progress-container" class="fixed top-[48px] left-0 right-0 h-1 bg-slate-200 z-40 hidden">
    <div id="reader-top-progress-fill" class="h-full bg-indigo-600 w-0 transition-all duration-200"></div>
    <div id="reader-top-progress-label" class="absolute right-2 top-2 bg-slate-900/80 text-white text-[10px] px-1.5 py-0.5 rounded font-mono hidden">0%</div>
</div>

<div id="sbBack" onclick="toggleToc()" class="fixed inset-0 bg-black/40 z-50 hidden transition-opacity duration-300 opacity-0"></div>
<div id="sbPanel" class="fixed top-0 bottom-0 left-0 w-[280px] bg-white border-r border-slate-200 z-50 shadow-2xl transform -translate-x-full transition-transform duration-300 flex flex-col">
    <div class="p-4 border-bottom border-slate-100 flex items-center justify-between bg-slate-50">
        <h2 class="font-bold text-slate-800 flex items-center"><i class="fa-solid fa-book-open text-indigo-600 mr-2"></i>회차 목차</h2>
        <button onclick="toggleToc()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>
    <div id="sbToc" class="flex-1 overflow-y-auto p-2 space-y-1">
        </div>
</div>

<div id="fontModal" onclick="closeFontModal()" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div onclick="event.stopPropagation()" class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-xl transform scale-95 transition-transform duration-200">
        <h3 class="font-bold text-slate-900 mb-4 flex items-center"><i class="fa-solid fa-sliders text-indigo-600 mr-2"></i>보기 설정</h3>
        
        <div class="space-y-4">
            <div>
                <label class="text-xs font-bold text-slate-500 block mb-1.5">글꼴 선택</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="changeFont('serif')" class="py-2 border border-slate-200 rounded-xl font-serif text-sm hover:border-indigo-500 font-medium">명조체</button>
                    <button onclick="changeFont('sans')" class="py-2 border border-slate-200 rounded-xl font-sans text-sm hover:border-indigo-500 font-medium">고딕체</button>
                    <button onclick="changeFont('song')" class="py-2 border border-slate-200 rounded-xl font-medium style-song text-sm hover:border-indigo-500">송명체</button>
                </div>
            </div>
            
            <div>
                <label class="text-xs font-bold text-slate-500 block mb-1.5">글자 크기</label>
                <div class="flex items-center justify-between bg-slate-50 p-2 border border-slate-200 rounded-xl">
                    <button onclick="adjustFontSize(-1)" class="w-8 h-8 rounded-lg bg-white border border-slate-200 shadow-sm font-bold text-slate-600 hover:bg-slate-50">-</button>
                    <span id="font-size-indicator" class="font-mono text-sm font-bold text-slate-700">16px</span>
                    <button onclick="adjustFontSize(1)" class="w-8 h-8 rounded-lg bg-white border border-slate-200 shadow-sm font-bold text-slate-600 hover:bg-slate-50">+</button>
                </div>
            </div>

            <div>
                <label class="text-xs font-bold text-slate-500 block mb-1.5">줄간격 설정</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="changeLineHeight('1.5')" class="py-1.5 border border-slate-200 rounded-xl text-xs font-mono font-bold">1.5</button>
                    <button onclick="changeLineHeight('1.8')" class="py-1.5 border border-slate-200 rounded-xl text-xs font-mono font-bold border-indigo-600 text-indigo-600 bg-indigo-50/20">1.8</button>
                    <button onclick="changeLineHeight('2.1')" class="py-1.5 border border-slate-200 rounded-xl text-xs font-mono font-bold">2.1</button>
                </div>
            </div>
        </div>
        
        <button onclick="closeFontModal()" class="w-full mt-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold text-sm shadow-sm">설정 완료</button>
    </div>
</div>

<div id="shareModal" onclick="closeShareModal()" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div onclick="event.stopPropagation()" class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-xl text-center">
        <div class="w-16 h-16 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-paper-plane text-2xl"></i>
        </div>
        <h3 class="font-bold text-slate-800 text-lg mb-1">클라우드 저장 완료!</h3>
        <div class="flex items-center space-x-1.5 bg-slate-50 p-2.5 border border-slate-200 rounded-xl mb-4 mt-4">
            <input type="text" id="share-link-input" readonly class="bg-transparent text-slate-600 text-xs flex-1 outline-none font-semibold truncate">
            <button onclick="copyShareLink()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold">복사하기</button>
        </div>
        <button onclick="closeShareModal()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-sm">창 닫기</button>
    </div>
</div>

<div id="yt-audio-container" style="position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;overflow:hidden;opacity:0;pointer-events:none;">
    <div id="ytAudioPlayer"></div>
</div>

<div id="pc-view" class="hidden pt-[48px] h-screen flex">
    <div class="w-[60px] border-r border-slate-200 flex flex-col items-center py-4 justify-between bg-white select-none">
        <button id="pcPrev" onclick="pcPrevPage()" class="w-10 h-10 rounded-xl flex items-center justify-center border border-slate-200 hover:bg-slate-50 disabled:opacity-30 disabled:hover:bg-white"><i class="fa-solid fa-chevron-left text-sm"></i></button>
        <div id="pc-page-dots" class="flex flex-col space-y-2 max-h-[60vh] overflow-y-auto px-2 py-1"></div>
        <button id="pcNext" onclick="pcNextPage()" class="w-10 h-10 rounded-xl flex items-center justify-center border border-slate-200 hover:bg-slate-50 disabled:opacity-30 disabled:hover:bg-white"><i class="fa-solid fa-chevron-right text-sm"></i></button>
    </div>
    <div id="pc-container" class="flex-1 relative bg-slate-100 overflow-hidden"></div>
</div>

<div id="mob-view" class="hidden fixed inset-0 overflow-hidden bg-black select-none">
    <div id="mob-strip" class="h-full flex will-change-transform"></div>
</div>

<div id="statusbar" class="fixed bottom-0 left-0 right-0 h-8 bg-white border-t border-slate-200 flex items-center justify-between px-4 text-xs text-slate-500 z-40 select-none">
    <div class="flex items-center space-x-2 font-medium">
        <i class="fa-solid fa-bookmark text-indigo-500"></i>
        <span id="sbText">표지</span>
    </div>
    <div class="flex items-center space-x-4 w-1/3 max-w-xs">
        <div class="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden border border-slate-200/60">
            <div id="sbFill" class="h-full bg-indigo-500 w-0 transition-all duration-300"></div>
        </div>
    </div>
</div>

<div id="master-music-widget" class="fixed bottom-12 right-4 bg-slate-900/90 text-white p-2.5 rounded-2xl shadow-xl z-50 flex items-center space-x-3 border border-white/10 backdrop-blur-md hidden transition-all duration-300 translate-y-2 opacity-0">
    <div class="relative w-8 h-8 flex items-center justify-center bg-indigo-600 rounded-xl shadow-inner">
        <i id="master-widget-disc" class="fa-solid fa-compact-disc text-base"></i>
    </div>
    <div class="flex flex-col max-w-[110px]">
        <span class="text-[10px] text-indigo-400 font-bold uppercase tracking-wider">Now Playing</span>
        <span id="master-widget-title" class="text-xs font-bold truncate opacity-90">배경음악 재생 중</span>
    </div>
    <button onclick="toggleMasterPlayPause()" class="w-7 h-7 rounded-lg bg-white/10 hover:bg-white/20 flex items-center justify-center text-xs transition-colors">
        <i id="master-widget-play-icon" class="fa-solid fa-pause"></i>
    </button>
</div>

<script src="./js/app.js"></script>
</body>
</html>
