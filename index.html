<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주남 유니버스</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Song+Myung&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        html, body {
            min-height: 100vh;
            background: var(--bg);
        }

        /* ── 헤더 ── */
        .site-header {
            background: var(--paper);
            border-bottom: 0.5px solid var(--border);
            padding: 0 40px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .site-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .site-logo-mark {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--paper);
            font-size: 15px;
        }
        .site-logo-text {
            font-family: var(--serif);
            font-size: 16px;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: -0.01em;
        }
        .site-logo-sub {
            font-family: var(--sans);
            font-size: 11px;
            color: var(--ink3);
            margin-top: 1px;
        }

        /* ── 메인 콘텐츠 ── */
        .main-wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 56px 40px 80px;
        }
        .section-label {
            font-family: var(--sans);
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink3);
            margin-bottom: 20px;
        }
        .section-title {
            font-family: var(--serif);
            font-size: 26px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 40px;
            line-height: 1.3;
        }

        /* ── 작품 그리드 ── */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 32px 24px;
        }
        .book-card {
            cursor: pointer;
            text-decoration: none;
            display: block;
        }
        .book-cover-wrap {
            width: 100%;
            aspect-ratio: 10 / 16;
            border-radius: 10px;
            overflow: hidden;
            background: var(--paper-back);
            border: 0.5px solid var(--border);
            box-shadow: 0 8px 20px -6px rgba(0,0,0,0.18), 0 2px 6px -2px rgba(0,0,0,0.10);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            position: relative;
        }
        .book-card:hover .book-cover-wrap {
            transform: translateY(-4px);
            box-shadow: 0 16px 32px -8px rgba(0,0,0,0.24), 0 4px 10px -2px rgba(0,0,0,0.12);
        }
        .book-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .book-cover-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: var(--accent2);
            opacity: 0.6;
        }
        .book-info {
            margin-top: 12px;
            padding: 0 2px;
        }
        .book-title {
            font-family: var(--serif);
            font-size: 14px;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.4;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .book-author {
            font-family: var(--sans);
            font-size: 12px;
            color: var(--ink3);
        }

        /* ── 로딩 스켈레톤 ── */
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 32px 24px;
        }
        .skeleton-card { display: block; }
        .skeleton-cover {
            width: 100%;
            aspect-ratio: 10 / 16;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--paper-back) 25%, var(--border) 50%, var(--paper-back) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }
        .skeleton-line {
            height: 13px;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--paper-back) 25%, var(--border) 50%, var(--paper-back) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            margin-top: 12px;
        }
        .skeleton-line.short { width: 55%; margin-top: 6px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* ── 에러/빈 상태 ── */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--ink3);
        }
        .empty-state i { font-size: 40px; margin-bottom: 16px; display: block; }
        .empty-state p { font-family: var(--sans); font-size: 14px; }

        /* ── 푸터 ── */
        .site-footer {
            border-top: 0.5px solid var(--border);
            padding: 24px 40px;
            text-align: center;
            font-family: var(--sans);
            font-size: 12px;
            color: var(--ink3);
            background: var(--paper);
        }
    </style>
</head>
<body>

<header class="site-header">
    <a href="index.html" class="site-logo">
        <div class="site-logo-mark"><i class="fa-solid fa-book-open-reader"></i></div>
        <div>
            <div class="site-logo-text">주남 유니버스</div>
            <div class="site-logo-sub">나만의 E-Book 플랫폼</div>
        </div>
    </a>
</header>

<main class="main-wrap">
    <div class="section-label">연재 중인 작품</div>
    <div class="section-title">모든 작품</div>

    <!-- 로딩 스켈레톤 -->
    <div class="skeleton-grid" id="skeleton">
        <div class="skeleton-card">
            <div class="skeleton-cover"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
        </div>
        <div class="skeleton-card">
            <div class="skeleton-cover"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
        </div>
    </div>

    <!-- 작품 목록 -->
    <div class="book-grid" id="book-grid" style="display:none;"></div>

    <!-- 빈 상태 -->
    <div class="empty-state" id="empty-state" style="display:none;">
        <i class="fa-solid fa-box-open"></i>
        <p>등록된 작품이 없습니다.</p>
    </div>
</main>

<footer class="site-footer">
    © 2026 주남 유니버스. All rights reserved.
</footer>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/app.js"></script>
<script>
(async function() {
    const db = await initFirebase();
    const skeleton = document.getElementById('skeleton');
    const grid = document.getElementById('book-grid');
    const empty = document.getElementById('empty-state');

    if (!db) {
        skeleton.style.display = 'none';
        empty.style.display = 'block';
        return;
    }

    const books = await loadAllBooks(db);

    skeleton.style.display = 'none';

    if (!books.length) {
        empty.style.display = 'block';
        return;
    }

    grid.style.display = 'grid';
    grid.innerHTML = books.map(book => {
        const coverUrl = convertImageUrl(
            book.coverUrlWebnovel || book.coverUrlStandard || book.coverUrlTablet || book.coverUrl || ''
        );
        const coverHtml = coverUrl
            ? `<img class="book-cover-img" src="${coverUrl}" alt="${book.title}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
            : '';
        const placeholderStyle = coverUrl ? 'display:none;' : '';
        return `
        <a class="book-card" href="toc.html?id=${book.id}">
            <div class="book-cover-wrap">
                ${coverHtml}
                <div class="book-cover-placeholder" style="${placeholderStyle}">❧</div>
            </div>
            <div class="book-info">
                <div class="book-title">${book.title || '제목 없음'}</div>
                <div class="book-author">${book.author || ''}</div>
            </div>
        </a>`;
    }).join('');
})();
</script>
</body>
</html>
