<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뷰어 — 주남 유니버스</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Song+Myung&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
        }

        /* ════════════════════════════════
           TOP BAR
        ════════════════════════════════ */
        #topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 52px;
            background: var(--paper);
            border-bottom: 0.5px solid var(--border);
            display: flex;
            align-items: stretch;
            z-index: 100;
            transform: translateY(-110%);
            transition: transform 0.25s ease;
        }
        #topbar.visible { transform: translateY(0); }
        body.ui-hidden #viewer-stage { top: 0; }

        /* 좌측 절반 — 목차+제목 */
        .tb-left {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 0 0 20px;
            min-width: 0;
        }
        /* 우측 절반 — 뷰모드+이전/다음 */
        .tb-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 0 20px 0 0;
        }

        .tb-icon-btn {
            width: 34px; height: 34px;
            border: none; background: none; cursor: pointer;
            border-radius: 8px;
            color: var(--ink2);
            font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s, color 0.15s;
            flex-shrink: 0;
        }
        .tb-icon-btn:hover { background: var(--border); color: var(--accent); }

        .tb-book-name {
            font-family: var(--serif);
            font-size: 15px;
            font-weight: 700;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tb-chapter-name {
            font-family: var(--sans);
            font-size: 12px;
            color: var(--ink3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tb-sep {
            width: 0.5px; height: 20px;
            background: var(--border);
            margin: 0 2px;
            flex-shrink: 0;
        }
        .tb-nav-btn {
            display: flex; align-items: center; gap: 5px;
            height: 32px; padding: 0 14px;
            border: 0.5px solid var(--border);
            border-radius: 8px; background: none; cursor: pointer;
            font-family: var(--sans); font-size: 13px; font-weight: 700;
            color: var(--ink2); transition: all 0.15s; white-space: nowrap;
        }
        .tb-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
        .tb-nav-btn:disabled { opacity: 0.25; pointer-events: none; }

        .view-mode-btn {
            display: flex; align-items: center; gap: 5px;
            height: 32px; padding: 0 14px;
            border: 0.5px solid var(--border);
            border-radius: 8px; background: none; cursor: pointer;
            font-family: var(--sans); font-size: 13px; font-weight: 700;
            color: var(--ink2); transition: all 0.15s;
        }
        .view-mode-btn:hover { border-color: var(--accent); color: var(--accent); }
        .view-mode-btn.active { background: var(--accent); border-color: var(--accent); color: var(--paper); }

        /* ════════════════════════════════
           뷰어 무대
        ════════════════════════════════ */
        #viewer-stage {
            position: fixed;
            top: 52px; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            transition: top 0.25s ease;
        }

        /* ════════════════════════════════
           가로 모드 (SPREAD) — CSS columns
        ════════════════════════════════ */
        #spread-viewer {
            width: 100%; height: 100%;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }

        /* 화살표 — 진짜 화면 엣지에 */
        .spread-arrow {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            width: 32px; height: 80px;
            border: none; background: rgba(180,168,148,0.25);
            cursor: pointer; color: var(--ink3);
            font-size: 22px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
            z-index: 20;
        }
        .spread-arrow:hover { background: rgba(180,168,148,0.5); color: var(--accent); }
        .spread-arrow:disabled { opacity: 0.12; pointer-events: none; }
        #arrow-prev { left: 0; border-radius: 0 6px 6px 0; }
        #arrow-next { right: 0; border-radius: 6px 0 0 6px; }

        /* 가운데 세로선 */
        #spread-divider {
            position: absolute;
            top: 40px; bottom: 40px;
            left: 50%; width: 0.5px;
            background: var(--border);
            z-index: 5;
            pointer-events: none;
        }

        /* column 컨테이너 — 전체 텍스트를 2단으로 흘림 */
        #spread-columns {
            position: absolute;
            /* 화살표 너비(32px) + 내부 여백(60px) */
            left: 92px; right: 92px;
            top: 0; bottom: 0;
            column-count: 2;
            column-gap: 0;
            overflow: hidden;
        }

        /* 각 column 안에 패딩을 주는 래퍼 */
        #spread-columns .col-pad {
            padding: 52px 56px 52px 56px;
            /* column-span 방지를 위해 display block */
            display: block;
        }

        /* column 내부 prose */
        #spread-columns .prose {
            font-size: 17px;
            line-height: 1.9;
        }
        #spread-columns .prose p {
            margin-bottom: 0.75em;
            text-indent: 1em;
            text-align: justify;
        }
        #spread-columns .prose p:first-child { text-indent: 0; }

        /* 챕터 헤더 */
        .ch-header-spread {
            margin-bottom: 36px;
            padding-bottom: 24px;
            border-bottom: 0.5px solid var(--border);
            break-after: avoid;
        }
        .ch-header-spread .ch-number {
            font-family: var(--sans);
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
        }
        .ch-header-spread .ch-title {
            font-family: var(--serif);
            font-size: 20px;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.35;
        }

        /* 진행 바 */
        #spread-progress {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 2px; background: var(--border);
        }
        #spread-progress-fill {
            height: 100%; background: var(--accent);
            transition: width 0.3s ease; width: 0%;
        }

        /* ════════════════════════════════
           세로 모드 (SCROLL)
        ════════════════════════════════ */
        #scroll-viewer {
            width: 100%; height: 100%;
            overflow-y: auto; overflow-x: hidden;
            display: none;
            background: var(--bg);
        }
        .scroll-inner {
            max-width: 680px;
            margin: 0 auto;
            padding: 52px 32px 100px;
        }
        .ch-header-scroll {
            text-align: center;
            margin-bottom: 44px;
            padding-bottom: 32px;
            border-bottom: 0.5px solid var(--border);
        }
        .ch-header-scroll .ch-number {
            font-family: var(--sans); font-size: 10px;
            letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--accent); margin-bottom: 12px;
        }
        .ch-header-scroll .ch-title {
            font-family: var(--serif); font-size: 22px;
            font-weight: 700; color: var(--ink); line-height: 1.35;
        }
        .ch-header-scroll .ch-dot {
            margin-top: 16px; color: var(--accent2);
            font-size: 14px; letter-spacing: 8px;
        }
        .scroll-prose .prose { font-size: 17px; line-height: 1.9; }
        .scroll-prose .prose p { margin-bottom: 0.85em; }

        #scroll-progress-bar {
            position: fixed; top: 52px; left: 0;
            height: 2px; background: var(--accent);
            width: 0%; z-index: 99; transition: width 0.08s linear;
        }
        .scroll-nav-footer {
            display: flex; align-items: center;
            justify-content: space-between; gap: 16px;
            margin-top: 60px; padding-top: 24px;
            border-top: 0.5px solid var(--border);
        }
        .scroll-nav-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 10px 18px;
            border: 0.5px solid var(--border); border-radius: 10px;
            background: var(--paper); cursor: pointer;
            font-family: var(--sans); font-size: 13px; font-weight: 700;
            color: var(--ink2); text-decoration: none; transition: all 0.15s;
        }
        .scroll-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
        .scroll-nav-btn:disabled { opacity: 0.25; pointer-events: none; }
        .scroll-chapter-end {
            font-family: var(--sans); font-size: 12px;
            color: var(--ink3); text-align: center; flex: 1;
        }

        /* ════════════════════════════════
           로딩
        ════════════════════════════════ */
        #loading-overlay {
            position: fixed; inset: 0; background: var(--paper);
            display: flex; align-items: center; justify-content: center;
            z-index: 200; flex-direction: column; gap: 16px;
            font-family: var(--sans); font-size: 13px; color: var(--ink3);
        }
        .loading-spinner {
            width: 28px; height: 28px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="loading-spinner"></div>
    <span>불러오는 중...</span>
</div>

<!-- 상단 바 -->
<div id="topbar">
    <div class="tb-left">
        <button class="tb-icon-btn" onclick="goToToc()" title="목차">
            <i class="fa-solid fa-list"></i>
        </button>
        <div style="display:flex;flex-direction:column;min-width:0;">
            <div class="tb-book-name" id="tb-book-name">—</div>
            <div class="tb-chapter-name" id="tb-chapter-name">—</div>
        </div>
    </div>
    <div class="tb-right">
        <button class="view-mode-btn" id="view-mode-btn" onclick="toggleViewMode()">
            <i class="fa-solid fa-scroll" id="view-mode-icon"></i>
            <span id="view-mode-label">세로</span>
        </button>
        <div class="tb-sep"></div>
        <button class="tb-nav-btn" id="btn-prev-ch" onclick="goChapter(-1)" disabled>
            <i class="fa-solid fa-chevron-left" style="font-size:10px;"></i> 이전화
        </button>
        <button class="tb-nav-btn" id="btn-next-ch" onclick="goChapter(1)">
            다음화 <i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
        </button>
    </div>
</div>

<!-- 뷰어 무대 -->
<div id="viewer-stage">

    <!-- 가로 모드 -->
    <div id="spread-viewer">
        <button class="spread-arrow" id="arrow-prev" onclick="spreadGo(-1)">‹</button>
        <div id="spread-divider"></div>
        <div id="spread-columns"></div>
        <button class="spread-arrow" id="arrow-next" onclick="spreadGo(1)">›</button>
        <div id="spread-progress"><div id="spread-progress-fill"></div></div>
    </div>

    <!-- 세로 모드 -->
    <div id="scroll-viewer">
        <div id="scroll-progress-bar"></div>
        <div class="scroll-inner">
            <div class="ch-header-scroll">
                <div class="ch-number" id="scroll-ch-number"></div>
                <div class="ch-title" id="scroll-ch-title"></div>
                <div class="ch-dot">· · ·</div>
            </div>
            <div class="scroll-prose" id="scroll-prose"></div>
            <div class="scroll-nav-footer">
                <button class="scroll-nav-btn" id="scroll-prev-btn" onclick="goChapter(-1)">
                    <i class="fa-solid fa-chevron-left" style="font-size:10px;"></i> 이전화
                </button>
                <div class="scroll-chapter-end" id="scroll-chapter-end"></div>
                <button class="scroll-nav-btn" id="scroll-next-btn" onclick="goChapter(1)">
                    다음화 <i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<div style="position:absolute;width:1px;height:1px;left:-9999px;overflow:hidden;opacity:0;">
    <div id="yt-audio-player"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="js/app.js"></script>
<script>
/* ════ 상태 ════ */
let bookData = null;
let bookId = '';
let currentChIdx = 0;
let viewMode = 'spread';

/* 가로 모드: 스프레드(2쪽) 단위 페이지네이션 */
let spreadCurSpread = 0;   // 현재 스프레드 인덱스
let spreadTotalSpreads = 1;

/* BGM */
let ytAudioPlayer = null;
let sunoAudioObject = null;
let currentPlayingMusicId = null;
let currentPlayingBtn = null;
let currentPlayingType = null;
let currentVolume = 15;

/* UI 토글 */
let uiVisible = false;
let uiHideTimer = null;

/* ════ 초기화 ════ */
window.onload = async function() {
    bookId = getParam('id');
    const chParam = getParam('ch');
    currentChIdx = chParam ? parseInt(chParam) : 0;

    if (!bookId) { location.href = 'index.html'; return; }

    const db = await initFirebase();
    if (!db) { hideLoading(); return; }

    bookData = await loadBook(db, bookId);
    if (!bookData || !bookData.chapters || !bookData.chapters.length) {
        hideLoading();
        showToast('작품을 불러올 수 없습니다.', 'error');
        return;
    }

    currentChIdx = Math.max(0, Math.min(currentChIdx, bookData.chapters.length - 1));
    updateTopbar();
    loadChapter(currentChIdx);
    hideLoading();

    // 처음 진입 시 잠깐 보여줬다 숨김
    setTimeout(() => { showUI(); setTimeout(hideUI, 2200); }, 700);

    window.addEventListener('resize', debounce(() => {
        if (viewMode === 'spread') buildSpreadView();
    }, 300));
};

function hideLoading() {
    const ov = document.getElementById('loading-overlay');
    if (ov) { ov.style.opacity = '0'; ov.style.transition = 'opacity 0.3s'; setTimeout(() => ov.remove(), 300); }
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ════ UI 토글 ════ */
function showUI() {
    uiVisible = true;
    document.getElementById('topbar').classList.add('visible');
    document.body.classList.remove('ui-hidden');
}
function hideUI() {
    uiVisible = false;
    document.getElementById('topbar').classList.remove('visible');
    document.body.classList.add('ui-hidden');
}
function toggleUI() {
    if (uiVisible) { hideUI(); }
    else { showUI(); clearTimeout(uiHideTimer); uiHideTimer = setTimeout(hideUI, 3000); }
}

// 본문 클릭 → UI 토글
document.getElementById('spread-viewer').addEventListener('click', e => {
    if (e.target.closest('button, a, .music-link')) return;
    toggleUI();
});
document.getElementById('scroll-viewer').addEventListener('click', e => {
    if (e.target.closest('button, a, .music-link, .scroll-nav-footer')) return;
    toggleUI();
});

/* ════ 상단 바 ════ */
function updateTopbar() {
    if (!bookData) return;
    const ch = bookData.chapters[currentChIdx];
    document.getElementById('tb-book-name').textContent = bookData.title || '';
    document.getElementById('tb-chapter-name').textContent = ch ? `제 ${currentChIdx + 1}화 — ${ch.title}` : '';
    document.title = ch ? `${currentChIdx + 1}화 ${ch.title} — ${bookData.title}` : bookData.title;
    document.getElementById('btn-prev-ch').disabled = currentChIdx <= 0;
    document.getElementById('btn-next-ch').disabled = currentChIdx >= bookData.chapters.length - 1;
}

/* ════ 챕터 이동 ════ */
function goChapter(dir) {
    const next = currentChIdx + dir;
    if (next < 0 || next >= bookData.chapters.length) return;
    currentChIdx = next;
    history.pushState({}, '', buildUrl('viewer.html', { id: bookId, ch: currentChIdx }));
    loadChapter(currentChIdx);
    saveBookmark(bookId, currentChIdx, 0);
}
function goToToc() { location.href = buildUrl('toc.html', { id: bookId }); }

function loadChapter(idx) {
    currentChIdx = idx;
    updateTopbar();
    resetMusicButtons();
    if (viewMode === 'spread') buildSpreadView();
    else buildScrollView();
}

/* ════ 뷰 모드 전환 ════ */
function toggleViewMode() {
    viewMode = viewMode === 'spread' ? 'scroll' : 'spread';
    const spreadEl = document.getElementById('spread-viewer');
    const scrollEl = document.getElementById('scroll-viewer');
    const btn = document.getElementById('view-mode-btn');
    const icon = document.getElementById('view-mode-icon');
    const label = document.getElementById('view-mode-label');

    if (viewMode === 'spread') {
        spreadEl.style.display = 'block';
        scrollEl.style.display = 'none';
        icon.className = 'fa-solid fa-scroll';
        label.textContent = '세로';
        btn.classList.remove('active');
        buildSpreadView();
    } else {
        spreadEl.style.display = 'none';
        scrollEl.style.display = 'block';
        icon.className = 'fa-solid fa-book-open';
        label.textContent = '가로';
        btn.classList.add('active');
        buildScrollView();
    }
}

/* ════════════════════════════════════════════
   가로 모드: CSS columns 기반 스프레드
   - 전체 챕터 HTML을 #spread-columns 에 넣고
   - column-count:2 로 좌→우 자동 흐름
   - 스프레드 이동 = translateX 로 스크롤
════════════════════════════════════════════ */
const PROSE_FONT = 17;
const PROSE_LH = 1.9;

function buildSpreadView() {
    const ch = bookData?.chapters[currentChIdx];
    if (!ch) return;

    const container = document.getElementById('spread-columns');
    const stage = document.getElementById('spread-viewer');

    // 컨테이너 가로 = 뷰어 가로 (화살표 제외 영역)
    // 2단이므로 전체 컨텐츠 너비 = 스프레드 수 * 컨테이너 너비
    // 높이는 뷰어 높이와 동일

    const stageW = stage.clientWidth;
    const stageH = stage.clientHeight;
    const arrowW = 32;
    const colAreaW = stageW - arrowW * 2; // 화살표 제외
    const colAreaH = stageH;

    // 챕터 헤더 + 산문 HTML
    const chapterHtml = `
        <div class="col-pad">
            <div class="ch-header-spread">
                <div class="ch-number">제 ${currentChIdx + 1}화</div>
                <div class="ch-title">${ch.title}</div>
            </div>
            <div class="prose" style="font-size:${PROSE_FONT}px;line-height:${PROSE_LH};">
                ${formatProse(ch.content)}
                <div class="chapter-end-marker">— 제 ${currentChIdx + 1}화 끝 —</div>
            </div>
        </div>
    `;

    // 일단 1개 스프레드(= colAreaW) 폭으로 렌더링해서 총 높이 측정
    container.style.width = colAreaW + 'px';
    container.style.height = colAreaH + 'px';
    container.style.columnCount = '2';
    container.style.columnGap = '0px';
    container.style.transform = 'translateX(0)';
    container.innerHTML = chapterHtml;

    // 실제 렌더 후 총 스프레드 수 계산
    // columns overflow 는 scrollWidth 로 잡힌다
    // 잠깐 overflow:auto 로 바꿔서 측정
    container.style.overflow = 'visible';
    const totalColWidth = container.scrollWidth;
    container.style.overflow = 'hidden';

    // 스프레드 수 = ceil(총너비 / colAreaW)
    spreadTotalSpreads = Math.max(1, Math.ceil(totalColWidth / colAreaW));
    spreadCurSpread = 0;
    renderSpreadPosition();
}

function renderSpreadPosition() {
    const stage = document.getElementById('spread-viewer');
    const arrowW = 32;
    const colAreaW = stage.clientWidth - arrowW * 2;
    const container = document.getElementById('spread-columns');

    // 현재 스프레드에 맞게 translateX
    container.style.transition = 'transform 0.3s ease';
    container.style.transform = `translateX(${-spreadCurSpread * colAreaW}px)`;

    // 화살표
    document.getElementById('arrow-prev').disabled = spreadCurSpread <= 0 && currentChIdx <= 0;
    document.getElementById('arrow-next').disabled = spreadCurSpread >= spreadTotalSpreads - 1 && currentChIdx >= bookData.chapters.length - 1;

    // 진행 바
    const pct = spreadTotalSpreads > 1 ? (spreadCurSpread / (spreadTotalSpreads - 1)) * 100 : 100;
    document.getElementById('spread-progress-fill').style.width = pct + '%';
}

function spreadGo(dir) {
    const next = spreadCurSpread + dir;
    if (next >= 0 && next < spreadTotalSpreads) {
        spreadCurSpread = next;
        renderSpreadPosition();
    } else if (dir > 0 && currentChIdx < bookData.chapters.length - 1) {
        goChapter(1);
    } else if (dir < 0 && currentChIdx > 0) {
        goChapter(-1);
    }
}

// 키보드
document.addEventListener('keydown', e => {
    if (viewMode === 'spread') {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') spreadGo(1);
        if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   spreadGo(-1);
    }
});

// 마우스휠
let wheelCooldown = false;
document.getElementById('spread-viewer').addEventListener('wheel', e => {
    if (viewMode !== 'spread' || wheelCooldown) return;
    wheelCooldown = true;
    setTimeout(() => wheelCooldown = false, 500);
    if (e.deltaY > 0 || e.deltaX > 0) spreadGo(1);
    else spreadGo(-1);
}, { passive: true });

/* ════ 세로 모드 ════ */
function buildScrollView() {
    const ch = bookData?.chapters[currentChIdx];
    if (!ch) return;

    document.getElementById('scroll-ch-number').textContent = `제 ${currentChIdx + 1}화`;
    document.getElementById('scroll-ch-title').textContent = ch.title;
    document.getElementById('scroll-chapter-end').textContent = `— 제 ${currentChIdx + 1}화 끝 —`;
    document.getElementById('scroll-prose').innerHTML =
        `<div class="prose" style="font-size:${PROSE_FONT}px;line-height:${PROSE_LH};">${formatProse(ch.content)}<div class="chapter-end-marker">— 제 ${currentChIdx + 1}화 끝 —</div></div>`;

    document.getElementById('scroll-prev-btn').disabled = currentChIdx <= 0;
    document.getElementById('scroll-next-btn').disabled = currentChIdx >= bookData.chapters.length - 1;

    const scrollEl = document.getElementById('scroll-viewer');
    scrollEl.scrollTop = 0;
    scrollEl.onscroll = () => {
        const sh = scrollEl.scrollHeight - scrollEl.clientHeight;
        const pct = sh > 0 ? (scrollEl.scrollTop / sh) * 100 : 0;
        document.getElementById('scroll-progress-bar').style.width = pct + '%';
    };
}

/* ════ BGM ════ */
function triggerAutoplay(container) {
    if (!container) return;
    const autoBtn = container.querySelector('.music-link[data-autoplay="true"]');
    if (!autoBtn || currentPlayingMusicId) return;
    const url = autoBtn.getAttribute('data-music-url');
    if (url) togglePlayMusic(url, autoBtn);
}

function resetMusicButtons() {
    document.querySelectorAll('.music-link').forEach(btn => {
        btn.classList.remove('playing');
        const i = btn.querySelector('.fa-compact-disc');
        if (i) i.style.animation = '';
    });
    if (sunoAudioObject) { sunoAudioObject.pause(); sunoAudioObject = null; }
    currentPlayingMusicId = null; currentPlayingBtn = null; currentPlayingType = null;
}

function togglePlayMusic(url, btn) {
    const vid = extractVideoId(url), sid = extractSunoId(url);
    if (!vid && !sid) { showToast('지원하지 않는 링크입니다.', 'error'); return; }
    const isSuno = !!sid, tid = isSuno ? sid : vid;
    if (currentPlayingMusicId === tid) {
        if (isSuno && sunoAudioObject) {
            if (sunoAudioObject.paused) sunoAudioObject.play(); else sunoAudioObject.pause();
        } else if (ytAudioPlayer) {
            const s = ytAudioPlayer.getPlayerState();
            if (s === YT.PlayerState.PLAYING) ytAudioPlayer.pauseVideo(); else ytAudioPlayer.playVideo();
        }
        return;
    }
    resetMusicButtons();
    currentPlayingMusicId = tid; currentPlayingBtn = btn; currentPlayingType = isSuno ? 'suno' : 'youtube';
    if (btn) btn.classList.add('playing');
    if (isSuno) {
        const isUUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(sid);
        if (!isUUID) { resetMusicButtons(); showToast('Suno 전체 URL을 사용해 주세요.', 'error'); return; }
        if (ytAudioPlayer?.pauseVideo) ytAudioPlayer.pauseVideo();
        sunoAudioObject = new Audio(`https://cdn1.suno.ai/${sid}.mp3`);
        sunoAudioObject.volume = currentVolume / 100;
        sunoAudioObject.play().catch(() => resetMusicButtons());
        sunoAudioObject.onended = resetMusicButtons;
    } else {
        if (ytAudioPlayer?.cueVideoById) {
            ytAudioPlayer.cueVideoById(vid);
            setTimeout(() => { ytAudioPlayer.setVolume(currentVolume); ytAudioPlayer.playVideo(); }, 150);
        } else { showToast('플레이어 준비 중입니다. 잠시 후 다시 눌러주세요.', 'error'); resetMusicButtons(); }
    }
}

function onYouTubeIframeAPIReady() {
    ytAudioPlayer = new YT.Player('yt-audio-player', {
        height: '0', width: '0', videoId: '',
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, fs: 0, rel: 0 },
        events: {
            onStateChange: e => { if (e.data === YT.PlayerState.ENDED) resetMusicButtons(); },
            onReady: e => e.target.setVolume(currentVolume)
        }
    });
}
</script>
